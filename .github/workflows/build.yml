name: Build PS4 Linux Payloads

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm yasm zip

      - name: Build PS4 payloads
        run: |
          cd linux
          make clean
          make

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts/bin artifacts/elf
          find linux/payloads -name 'linux-*.bin' -exec cp {} artifacts/bin/ \;
          find linux/payloads -name 'linux-*.elf' -exec cp {} artifacts/elf/ \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-linux-payloads
          path: |
            artifacts/bin
            artifacts/elf

      - name: Commit built payloads
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f linux/payloads/*.bin

          if git diff --cached --quiet; then
            echo "No payload changes to commit."
            exit 0
          fi

          git commit -m "Build PS4 Linux payloads"
          git push origin master
